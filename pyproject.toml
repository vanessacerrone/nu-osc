[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nu-osc"
version = "0.1.0"
description = "Three-flavour neutrino oscillations in vacuum and matter (NuFast), with T2K, NOvA, DUNE and Hyper-K far-detector spectra"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Vanessa Cerrone" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "SciencePlots>=2.0",
    "uproot>=5",
    "jupyter",
    "ipykernel",
]

[project.urls]
Repository = "https://github.com/vanessacerrone/nu-osc"

[tool.setuptools]
packages = ["nuosc"]        # pip name nu-osc, imported as nuosc
